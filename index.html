<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game Invitation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            padding: 20px;
        }
        h1 {
            color: #e74c3c;
        }
        .button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 16px;
        }
        .disclaimer {
            font-size: 12px;
            margin-top: 20px;
            color: #555;
        }
        #countdown {
            font-size: 24px;
            color: #e74c3c;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Squid Game</h1>
    <p>Please enter your name to join:</p>
    <input type="text" id="nameInput" placeholder="Your Name"><br><br>
    <button class="button" onclick="handleResponse('yes')">Yes</button>
    <button class="button" onclick="handleResponse('no')">No</button>
    <p class="disclaimer">Disclaimer: Participation is at your own risk. This is a fictional game.</p>
    <div id="countdown"></div>

    <script>
        function handleResponse(response) {
            const name = document.getElementById('nameInput').value;
            if (response === 'yes') {
                alert(`Welcome, ${name}! Prepare for the game!`);
            } else {
                alert(`Goodbye, ${name}. Stay safe!`);
            }
        }

        // Countdown Timer
        let countdownDate = new Date(Date.UTC(2026, 2, 22, 12, 30, 58)).getTime();
        let countdownFunction = setInterval(function() {
            let now = new Date().getTime();
            let distance = countdownDate - now;
            let days = Math.floor(distance / (1000 * 60 * 60 * 24));
            let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById('countdown').innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
            if (distance < 0) {
                clearInterval(countdownFunction);
                document.getElementById('countdown').innerHTML = "EXPIRED";
            }
        }, 1000);
    </script>
</body>
</html>
