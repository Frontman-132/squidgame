<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
        }
        .yes-button {
            background-color: blue;
            color: white;
        }
        .no-button {
            background-color: red;
            color: white;
        }
        .disclaimer {
            margin-top: 20px;
            font-size: 14px;
            color: gray;
        }
        .input-field {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 80%;
        }
    </style>
</head>
<body>
    <h1>Welcome to Squid Game</h1>
    <input type="text" class="input-field" placeholder="Enter your name" required>
    <br>
    <button class="button yes-button">YES</button>
    <button class="button no-button">NO</button>
    <p class="disclaimer">Participation in the game is voluntarily. By entering, players accept the rules and the conditions of the organisers. Players who fail to compete a challenge or break the rules will be eliminated from the game.</p>
</body>
</html>
